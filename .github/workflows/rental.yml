name: South Dublin Housing Rental

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-run/rental"
  schedule:
    - cron: "0 7 * * 1"
      timezone: "Europe/Dublin"

concurrency:
  group: south-dublin-housing-rental
  cancel-in-progress: false

jobs:
  send-rental-email:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check baseline data
        run: |
          test -f data/private_rentals.json
          test -f data/cost_rental.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Preflight live listings, HTML, CID map and SMTP
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_rental.py --preflight

      - name: Generate and send one canonical email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_rental.py --send
