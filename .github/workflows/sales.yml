name: South Dublin Housing Sales

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-run/sales"
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Dublin"

permissions:
  contents: write

concurrency:
  group: south-dublin-housing-sales
  cancel-in-progress: false

jobs:
  send-sales-email:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check baseline data
        run: |
          test -f data/sales_listings.json
          test -f data/sales_insights.json
          test -f data/sales_new_build_candidates.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh and compare sales sources
        run: >-
          python scripts/refresh_sales.py --strict --discovery-limit 8 --max-new 12
          --max-private 6 --max-apartment-only 1 --new-build-detail-limit 30
          --max-new-build-projects 18 --max-new-build-additions 6
          --max-affordable-projects 4 --max-affordable-additions 2
          --min-new-build-sources 2

      - name: Run tests
        run: pytest -q

      - name: Preflight HTML, CID map and SMTP
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_sales.py --preflight

      - name: Generate and send one canonical email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_sales.py --send

      - name: Persist refreshed source data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/sales_listings.json data/sales_insights.json data/sales_new_build_candidates.json)" ]]; then
            echo "No source-data changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sales_listings.json data/sales_insights.json data/sales_new_build_candidates.json
          git commit -m "data: refresh sales sources $(TZ=Europe/Dublin date +%F)"
          git push
