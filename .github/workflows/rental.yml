name: South Dublin Housing Rental

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-run/rental"
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 8 * * *"

jobs:
  send-rental-email:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Check intended Dublin schedule
        id: local_time
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
            echo "send_now=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          offset="$(TZ=Europe/Dublin date +%z)"
          scheduled="${{ github.event.schedule }}"
          if [[ "$offset" == "+0100" && "$scheduled" == "15 7 * * *" ]]; then
            echo "send_now=true" >> "$GITHUB_OUTPUT"
          elif [[ "$offset" == "+0000" && "$scheduled" == "15 8 * * *" ]]; then
            echo "send_now=true" >> "$GITHUB_OUTPUT"
          else
            echo "send_now=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check runtime data
        id: runtime_data
        if: steps.local_time.outputs.send_now == 'true'
        run: |
          if test -f data/private_rentals.json && test -f data/cost_rental.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Rental runtime data is not present; no email will be sent."
          fi
      - uses: actions/setup-python@v5
        if: steps.runtime_data.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.runtime_data.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Test
        if: steps.runtime_data.outputs.ready == 'true'
        run: pytest -q
      - name: Generate and send
        if: steps.runtime_data.outputs.ready == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_rental.py --send
