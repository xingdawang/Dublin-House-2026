name: Housing Automation CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "dublin_house/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: housing-automation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q dublin_house scripts tests

      - name: Run tests
        run: pytest -q
