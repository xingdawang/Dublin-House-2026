name: South Dublin Housing Sales

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/manual-run/sales"
  schedule:
    - cron: "7 7 * * *"
      timezone: "Europe/Dublin"

permissions:
  contents: write

concurrency:
  group: south-dublin-housing-sales
  cancel-in-progress: false

jobs:
  send-sales-email:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Check baseline data
        run: |
          test -f data/sales_listings.json
          test -f data/sales_insights.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh and compare sales sources
        run: python scripts/refresh_sales.py --strict --discovery-limit 25 --max-new 6
      - name: Test
        run: pytest -q
      - name: Preflight email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_sales.py --preflight
      - name: Generate and send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_sales.py --send
      - name: Persist refreshed source data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/sales_listings.json data/sales_insights.json)" ]]; then
            echo "No source-data changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sales_listings.json data/sales_insights.json
          git commit -m "data: refresh sales sources $(TZ=Europe/Dublin date +%F)"
          git push
