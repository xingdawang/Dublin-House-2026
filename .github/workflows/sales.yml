name: South Dublin Housing Sales

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"

jobs:
  send-sales-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dublin local time
        id: local_time
        run: echo "hour=$(TZ=Europe/Dublin date +%H)" >> "$GITHUB_OUTPUT"
      - name: Check runtime data
        id: runtime_data
        if: github.event_name == 'workflow_dispatch' || steps.local_time.outputs.hour == '08'
        run: |
          if test -f data/sales_listings.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "sales_listings.json is not present; no email will be sent."
          fi
      - uses: actions/setup-python@v5
        if: steps.runtime_data.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.runtime_data.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Test
        if: steps.runtime_data.outputs.ready == 'true'
        run: pytest -q
      - name: Generate and send
        if: steps.runtime_data.outputs.ready == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/run_sales.py --send
